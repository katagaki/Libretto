<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The page glyph: a sheet with its top corner folded over. The lines of
    text set on it live in Lines.svg, a layer of their own, so they can be
    kept white in dark mode while the sheet takes on the icon's tint.
    Drawn in white — Icon Composer tints and lights the layer, so the artwork
    carries only shape and opacity.
  -->
