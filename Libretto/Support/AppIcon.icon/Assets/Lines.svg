<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The lines of text set on the page. They step through opacity, a heading
    first and the body after, so the page reads as a document rather than a
    blank sheet. Drawn in white; the layer is filled solid white in dark mode,
    where Icon Composer would otherwise tint it into the page behind it.
  -->
  <g fill="#FFFFFF">
    <rect x="324" y="300" width="216" height="40" rx="20" opacity="0.95"/>
    <rect x="324" y="420" width="368" height="28" rx="14" opacity="0.8"/>
    <rect x="324" y="492" width="368" height="28" rx="14" opacity="0.8"/>
    <rect x="324" y="564" width="368" height="28" rx="14" opacity="0.8"/>
    <rect x="324" y="636" width="248" height="28" rx="14" opacity="0.8"/>
  </g>
</svg>
